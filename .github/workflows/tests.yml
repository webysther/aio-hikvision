name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group dev

      - name: Check the formatting (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Test (pytest)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  lean:
    name: Without extras
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the package alone
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # The default install imports no dependency, and a part without its extra says how to
      # install it
      - name: Import the core with the standard library only
        working-directory: /tmp
        run: |
          python -I - <<'PY'
          import sys

          import aiohikvision
          from aiohikvision import MissingExtra

          loaded = {"aiohttp", "yarl", "defusedxml", "aiosipua", "cryptography"} & set(sys.modules)
          assert not loaded, loaded
          try:
              aiohikvision.HikvisionClient
          except MissingExtra as err:
              print(err)
          else:
              raise SystemExit("HikvisionClient imported without aiohikvision[isapi]")
          PY
